# =============================================================================
# 企业门户网站 Nginx 配置
#
# 放置位置：/etc/nginx/conf.d/ruoyi.conf
# 前端根目录：/opt/ruoyi-ui
# 后端地址：http://127.0.0.1:8080
#
# 设计原则：
#   SPA 路由回退      → try_files（不用 rewrite）
#   接口前缀剥离      → proxy_pass 末尾 /（不用 rewrite）
#   URL 迁移/参数改写  → rewrite（见 rewrite-lab.conf）
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /opt/ruoyi-ui;
    index  index.html;

    client_max_body_size 20m;

    # ---------------------------------------------------------------------
    # 一、正式站点（现代写法）
    # ---------------------------------------------------------------------

    # SPA history 路由回退：先找真实文件，找不到才交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口代理：末尾的 / 会把 /prod-api 前缀自动去掉
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1k;

    # ---------------------------------------------------------------------
    # 二、rewrite 教学演示区
    #     规则全部放在独立文件里，课堂演示时逐条放开；
    #     不需要时注释掉下面这一行即可整体关闭，不影响正式站点。
    # ---------------------------------------------------------------------
    include /etc/nginx/snippets/rewrite-lab.conf;
}
