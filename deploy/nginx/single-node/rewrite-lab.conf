# =============================================================================
# Nginx rewrite 教学演示区（独立片段，可整段注释关闭）
#
# 放置位置：/etc/nginx/snippets/rewrite-lab.conf
# 引入方式：在 server { } 内加一行
#           include /etc/nginx/snippets/rewrite-lab.conf;
#
# 说明：
#   1. 本片段只演示 rewrite 模块，不改动主站的 try_files / proxy_pass 方案。
#   2. 全部规则集中在 /demo、/go、旧静态页等演示路径，不影响 /prod-api、
#      /static 等正式资源。
#   3. 调试阶段统一用 redirect(302)，确认无误后再把需要长期生效的改成
#      permanent(301)。301 会被浏览器强缓存，改错后很难回滚。
# =============================================================================


# -----------------------------------------------------------------------------
# 演示 1：外部跳转（301 permanent）——旧静态站页面 → 新门户锚点
# 知识点：地址栏会变化；permanent = 301，搜索引擎会把旧地址权重转移到新地址。
# 访问：http://<域名>/about.html
# 结果：地址栏变为 /portal#about，并自动滚动到“关于我们”
# -----------------------------------------------------------------------------
rewrite ^/about\.html$    /portal#about     permanent;
rewrite ^/business\.html$ /portal#business  permanent;
rewrite ^/news\.html$     /portal#news      permanent;
rewrite ^/contact\.html$  /portal#contact   permanent;

# 用一条正则覆盖多个路径的写法（与上面四条等价，适合课堂对比）
# rewrite ^/(about|business|news|contact)\.html$ /portal#$1 permanent;


# -----------------------------------------------------------------------------
# 演示 2：外部跳转（302 redirect）——短链接入口
# 知识点：redirect = 302，临时跳转，浏览器不会长期缓存，适合做活动/入口短链。
# 访问：http://<域名>/go/admin  → 登录页
#      http://<域名>/go/portal → 企业官网
#      http://<域名>/go/lab    → 本演示台
# -----------------------------------------------------------------------------
rewrite ^/go/admin$  /login          redirect;
rewrite ^/go/portal$ /portal         redirect;
rewrite ^/go/lab$    /rewrite-lab.html redirect;


# -----------------------------------------------------------------------------
# 演示 3：正则捕获组 + 参数 + 锚点
# 知识点：$1 $2 $3 依次对应正则里的三个捕获组；? 后面是查询参数；
#        #news 让浏览器跳到新闻区块。
# 访问：http://<域名>/news/2026/10/18
# 结果：地址栏变为 /portal?date=2026-10-18#news，
#       门户新闻区会出现“由 Nginx rewrite 跳转进入 · 参数 date=2026-10-18”
# -----------------------------------------------------------------------------
rewrite ^/news/(\d{4})/(\d{2})/(\d{2})/?$ /portal?date=$1-$2-$3#news permanent;


# -----------------------------------------------------------------------------
# 演示 4：内部重写（不带 flag 或 last）——地址栏不变，内容被替换
# 知识点：这是 rewrite 和“跳转”的核心差别：浏览器完全不知道发生了什么。
# 访问：http://<域名>/demo/old-page.html
# 结果：地址栏仍是 /demo/old-page.html，但页面内容是 rewrite-lab.html
# -----------------------------------------------------------------------------
rewrite ^/demo/old-page\.html$ /rewrite-lab.html last;

# 对照示例：同样请求，如果写成下面这样，地址栏会变（外部跳转）
# rewrite ^/demo/redirect-page\.html$ /rewrite-lab.html permanent;


# -----------------------------------------------------------------------------
# 演示 5：大小写归一（~* 表示匹配时不区分大小写）
# 知识点：rewrite 默认区分大小写，~* 是 location/if 的匹配修饰符；
#        这里直接用 [^ ] 精确匹配大写写法，便于课堂观察。
# 访问：http://<域名>/PORTAL
# 结果：301 跳到 /portal
# -----------------------------------------------------------------------------
rewrite ^/PORTAL$ /portal permanent;


# -----------------------------------------------------------------------------
# 演示 6：API 前缀改写 + 反向代理
# 知识点：rewrite ... break 在 location 内改写 URI 后，仍由本 location 的
#        proxy_pass 转发；proxy_pass 末尾不带 / 时，转发的是改写后的 $uri。
# 访问：curl -X POST http://<域名>/api/v1/login \
#         -H 'Content-Type: application/json' \
#         -d '{"username":"admin","password":"admin123"}'
# 结果：实际请求后端 /login，返回 token。
# 注意：不能用浏览器直接打开（POST 接口），用 curl 或 Apifox 验证。
# -----------------------------------------------------------------------------
location /api/v1/ {
    rewrite ^/api/v1/(.*)$ /$1 break;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8080;
}


# -----------------------------------------------------------------------------
# 演示 7（选做）：按 User-Agent 跳转移动端
# 知识点：if 可以出现在 server/location 中，但 Nginx 官方建议“if is evil”，
#        能不用就不用；这里仅作为反例讲解，默认关闭。
# 打开方式：去掉下面 if 前面的注释符号。
# -----------------------------------------------------------------------------
# if ($http_user_agent ~* "(Android|iPhone|iPad|Mobile)") {
#     rewrite ^/portal$ /portal?from=mobile redirect;
# }
