# 门户网站后端 upstream（04-门户网站前端与Nginx高可用部署手册 5.2）
# 上传位置：/etc/nginx/conf.d/00-upstream.conf
#
# 两台后端必须是同一个 website.jar，仅主机名不同；/lb/info 返回的 instanceId
# 分别为 db-backend-01:8080 和 db-backend-02:8080。

upstream portal_backend {
    server 192.168.11.11:8080 max_fails=1 fail_timeout=10s;
    server 192.168.11.12:8080 max_fails=1 fail_timeout=10s;
}
