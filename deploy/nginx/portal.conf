# 门户主站 + rewrite 演示（04 章 5.3）
# 上传位置：/etc/nginx/conf.d/portal.conf
# 由 /etc/nginx/nginx.conf 中的 include /etc/nginx/conf.d/*.conf; 自动加载

# ---------- HTTP：强制跳转 HTTPS ----------
server {
    listen 80;
    server_name portal.local;

    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name portal.local;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/website-ui;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA history 路由回退（/portal、/login 刷新不会 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- rewrite 演示规则 ----------
    # 旧静态站页面 → 新门户锚点（301，地址栏变化）
    rewrite ^/about\.html$    /portal#about     permanent;
    rewrite ^/business\.html$ /portal#business  permanent;
    rewrite ^/news\.html$     /portal#news      permanent;
    rewrite ^/contact\.html$  /portal#contact   permanent;

    # 短链接（302）
    rewrite ^/go/portal$ /portal redirect;
    rewrite ^/go/admin$  /login           redirect;
    rewrite ^/go/lab$    /rewrite-lab.html redirect;

    # 捕获组：/news/2026/10/18 → /portal?date=2026-10-18#news
    # 注意：含 {4} 的正则必须用双引号包起来，否则 nginx -t 会报错
    rewrite "^/news/(\d{4})/(\d{2})/(\d{2})/?$" "/portal?date=$1-$2-$3#news" permanent;

    # 伪静态演示：用真实静态文件，避免 SPA 路由 404
    rewrite ^/legacy/guide\.html$ /rewrite-lab.html last;

    # 大写路径归一
    rewrite ^/PORTAL$ /portal permanent;

    # 内部重写：地址不变，内容替换为演示台
    rewrite ^/demo/old-page\.html$ /rewrite-lab.html last;

    # 演示用 API 版本前缀：/api/v1/login → /login
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://portal_backend;
    }

    # 后端接口代理（^~ 防止被静态资源正则拦截；末尾 / 去掉 /prod-api 前缀）
    location ^~ /prod-api/ {
        proxy_pass http://portal_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 把实际处理请求的后端地址写进响应头，供 lb-lab.html 展示
        add_header X-Backend $upstream_addr always;
    }

    # 上传文件、头像等后端资源（^~ 防止被静态资源正则拦截）
    location ^~ /profile/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
